plugins {
    id 'com.android.application'
}

def releaseKeystoreProperties = new Properties()
def releaseKeystoreFile = rootProject.file('keystore.properties')
if (releaseKeystoreFile.exists()) {
    releaseKeystoreProperties.load(new FileInputStream(releaseKeystoreFile))
}

android {
    namespace 'com.beaconfinder.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.beaconfinder.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile.exists()) {
                storeFile rootProject.file(releaseKeystoreProperties['storeFile'])
                storePassword releaseKeystoreProperties['storePassword']
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

dependencies {
    implementation files('libs/BaseSDK.jar')
    implementation files('libs/UHFReader.jar')
    implementation files('libs/feasybluelibrary.jar')
    implementation files('libs/mina-core-2.0.20.jar')
    implementation files('libs/slf4j-api-1.7.26.jar')
    implementation files('libs/fastjson-1.2.79.jar')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
